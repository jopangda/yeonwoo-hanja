<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E3F2FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한자놀이">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>연우 한자 카드놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 색동 stripes for level colors, a red seal stamp as the reward, white card tiles on a cool board */
  --bg:#F1F4F8;
  --card:#FFFFFF;
  --ink:#1D2130;
  --muted:#5F677A;
  --line:#DCE1EA;
  --seal:#D2382A;
  --good:#1C9660;
  --c8:#F2B01E; --c7b:#22A06B; --c7:#2F6FDB; --c6b:#DB4F92; --c6:#7C4BD8;
  --display:"Noto Serif KR","Batang","AppleMyungjo",serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--c7);outline-offset:2px}
.stripe{height:10px;background:linear-gradient(90deg,var(--seal) 0 16.66%,var(--c8) 0 33.33%,var(--c7b) 0 50%,var(--c7) 0 66.66%,var(--c6b) 0 83.33%,var(--c6) 0)}
.wrap{max-width:1000px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:230px}
.mark{width:50px;height:50px;border-radius:12px;background:var(--seal);color:#fff;font-family:var(--display);font-weight:900;font-size:32px;display:grid;place-items:center;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
h1{margin:0;font-size:28px;font-weight:400;letter-spacing:-.5px;text-wrap:balance;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:15px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stampbox{cursor:pointer;font-size:18px;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.stampbox b{color:var(--seal);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.mini-seal{width:28px;height:28px;border-radius:7px;background:var(--seal);color:#fff;font-family:var(--display);font-weight:900;font-size:17px;display:grid;place-items:center;transform:rotate(-6deg)}
.btn{font-size:18px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 16px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.sm{font-size:16px;padding:6px 12px}
.btn.big{font-size:22px;padding:12px 30px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.tog[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ptitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.muted{color:var(--muted)}
.levels{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--lc);background:var(--card);border-radius:999px;padding:6px 14px;font-size:18px;cursor:pointer}
.chip small{font-size:14px;opacity:.85}
.chip[aria-pressed="true"]{background:var(--lc);color:var(--lt,#fff)}
.chip.all{border-style:dashed;border-color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--card);padding:6px;border-radius:18px;border:2px solid var(--line)}
.tab{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tab .ti{font-family:var(--display);font-weight:900;font-size:24px;color:var(--seal)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab[aria-selected="true"] .ti{color:#FFD2CC}
#stage{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.seg{display:flex;gap:3px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px}
.seg .btn{border:0;border-radius:10px}
.seg .btn[aria-pressed="true"],.bar>.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.players{display:flex;gap:8px}
.pl{padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.pl b{font-weight:400;color:var(--seal);font-size:22px;font-variant-numeric:tabular-nums}
.pl.on{border-color:var(--seal);box-shadow:0 0 0 3px rgba(210,56,42,.22)}
.count{min-width:84px;text-align:center;font-variant-numeric:tabular-nums}

/* flip cards */
.fc{border:0;padding:0;background:none;cursor:pointer;perspective:900px;container-type:inline-size;border-radius:14px;display:block}
.fc .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.fc.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.face.b{transform:rotateY(180deg)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));margin:0 auto;width:100%}
.mcard{aspect-ratio:var(--ar,3/4);width:100%}
.mcard .back{background:linear-gradient(180deg,var(--seal) 0 20%,var(--c8) 0 40%,var(--c7b) 0 60%,var(--c7) 0 80%,var(--c6b) 0);border:3px solid #fff;box-shadow:0 3px 0 rgba(29,33,48,.12)}
.knot{width:44cqw;height:44cqw;border-radius:50%;background:#fff;color:var(--seal);font-family:var(--display);font-weight:900;font-size:26cqw;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mcard .front{background:var(--card);border:3px solid var(--lc);box-shadow:0 3px 0 rgba(29,33,48,.08)}
.lvbar{position:absolute;top:0;left:0;right:0;height:6cqw;background:var(--lc)}
.mcard .h{font-family:var(--display);font-weight:900;font-size:60cqw;line-height:1}
.mcard .e{font-family:var(--emoji);font-size:40cqw;line-height:1.15}
.mcard .t{font-size:15cqw;margin-top:3cqw;white-space:nowrap}
.mcard.done .front{background:#FFF8E6}
.mcard.done{animation:pop .45s}
.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.flash{width:min(100%,400px,max(250px,calc((100vh - 380px)*.75)));aspect-ratio:3/4;margin:0 auto}
.flash .face{background:var(--card);border:4px solid var(--lc);box-shadow:0 5px 0 rgba(29,33,48,.1)}
.tag{position:absolute;top:5cqw;left:5cqw;background:var(--lc);color:var(--lt,#fff);border-radius:999px;padding:1cqw 4cqw;font-size:6cqw}
.kn{position:absolute;top:5cqw;right:5cqw;color:var(--good);font-size:6cqw}
.flash .fa .h{font-family:var(--display);font-weight:900;font-size:64cqw;line-height:1}
.tap{position:absolute;bottom:5cqw;font-size:5.5cqw}
.flash .fb{gap:2cqw}
.flash .fb .e{font-family:var(--emoji);font-size:30cqw;line-height:1.15}
.flash .fb .t{font-size:12cqw}
.flash .fb .hs{font-family:var(--display);font-weight:900;font-size:14cqw;line-height:1}
.flash .fb .hint{font-size:6.2cqw;color:var(--muted);padding:0 8cqw;text-align:center;line-height:1.35;text-wrap:balance}

.qp{background:var(--card);border:4px solid var(--lc);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:480px;width:100%;margin:0 auto}
.qp .e{font-family:var(--emoji);font-size:84px;line-height:1.1}
.qp .t{font-size:36px}
.qp .h{font-family:var(--display);font-weight:900;font-size:124px;line-height:1.05}
.ask{margin:2px 0 0;color:var(--muted);font-size:20px}
.opts4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px;width:100%;margin:0 auto}
.opt{min-height:112px;border:3px solid var(--line);background:var(--card);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:22px;padding:8px;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt .h{font-family:var(--display);font-weight:900;font-size:66px;line-height:1}
.opt .e{font-family:var(--emoji);font-size:44px;line-height:1.1}
.opt.good{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{background:var(--seal);border-color:var(--seal);color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
.opt:disabled:not(.good):not(.bad){opacity:.5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.r{background:var(--good)}
.dot.w{background:var(--seal)}
.dot.cur{box-shadow:0 0 0 3px var(--ink)}
.fb{display:flex;flex-direction:column;align-items:center;gap:10px}
.fbcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 16px;border:2px solid var(--line);max-width:480px;width:100%}
.te{font-family:var(--emoji);font-size:36px}
.th{font-family:var(--display);font-weight:900;font-size:42px;line-height:1}
.empty{background:var(--card);border-radius:18px;padding:30px;text-align:center;border:2px dashed var(--line)}

#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:12px;transition:transform .3s;max-width:calc(100% - 32px);z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
#toast{z-index:20}
.tsub{color:#C9CEDA;font-size:15px}
#ov{position:fixed;inset:0;background:rgba(20,22,30,.55);display:none;place-items:center;z-index:10;padding:16px}
#ov.show{display:grid}
.ovbox{background:var(--card);border-radius:24px;padding:18px 22px;max-width:440px;max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ovbox h2{margin:4px 0 0;font-weight:400;font-size:30px}
.ovbox p{margin:0}
.seal{width:150px;height:150px;border:7px solid var(--seal);border-radius:24px;color:var(--seal);font-family:var(--display);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transform:rotate(-8deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1);margin:4px 0 10px}
.seal span:first-child{font-size:48px}
.seal span:last-child{font-size:26px}
@keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0}}
.foot{font-size:14px;text-align:center;margin:6px 0 0}

/* ---- 아기자기 테마 ---- */
:root{--bg:#E3F2FF;--ink:#34406E;--muted:#6B7699;--line:#C4DBF3;--seal:#FF6B6B;--good:#2FBF7F;
  --c8:#FFC53D;--c7b:#5CD69A;--c7:#6DB6FF;--c6b:#FF9CC8;--c6:#B39BFF;--sun:#FFD95A}
body{background:var(--bg) radial-gradient(circle,#fff 2.5px,transparent 3px) 0 0/30px 30px}
.stripe{height:14px;border-radius:0 0 14px 14px}
.mark{background:#fff;border-radius:50%;font-family:var(--emoji);font-size:30px;transform:none;box-shadow:0 4px 0 var(--line);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}
h1{color:var(--ink);text-shadow:0 2px 0 #fff}
.btn,.stampbox{border:3px solid #fff;border-radius:999px;box-shadow:0 4px 0 var(--line);background:#fff}
.btn:active,.stampbox:active,.opt:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--seal);border-color:#fff;color:#fff;box-shadow:0 4px 0 #D94F4F}
.btn.ok{background:var(--good);border-color:#fff;box-shadow:0 4px 0 #1F9A63}
.mini-seal{border-radius:50%}
.panel,.tabs{border:3px solid #fff;border-radius:26px;box-shadow:0 4px 0 var(--line)}
.chip{border-width:3px;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{color:var(--ink)}
.chip.rev[aria-pressed="true"]{color:#fff}
.tab{border-radius:20px}
.tab .ti{font-family:var(--emoji);font-size:24px}
.tab[aria-selected="true"]{background:var(--sun);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.seg{border:3px solid #fff;border-radius:999px;box-shadow:0 3px 0 var(--line)}
.seg .btn{border-radius:999px;box-shadow:none}
.seg .btn[aria-pressed="true"],.bar>.btn[aria-pressed="true"]{background:var(--c7);color:#fff;border-color:#fff}
.pl{border:3px solid #fff;border-radius:999px;box-shadow:0 3px 0 var(--line)}
.pl.on{border-color:var(--seal);box-shadow:0 3px 0 var(--seal);animation:bob 1.2s ease-in-out infinite}
.fc,.face{border-radius:22px}
.mcard .back{background:linear-gradient(135deg,#FFD3E6,#D3E6FF 55%,#D9F7E4) ;border:4px solid #fff;box-shadow:0 5px 0 var(--line)}
.mcard .back::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.8) 2px,transparent 2.5px) 0 0/16px 16px}
.knot{font-family:var(--emoji);font-size:24cqw;position:relative;background:#fff;box-shadow:0 3px 0 rgba(52,64,110,.15)}
.mcard .front{border-width:4px;box-shadow:0 5px 0 var(--line)}
.mcard.done .front{background:#FFF7D1}
.mcard.done .front::after{content:"⭐";font-family:var(--emoji);position:absolute;top:2cqw;right:3cqw;font-size:14cqw}
.lvbar{display:none}
.tag{color:var(--ink)}
.flash .face{border-width:5px;box-shadow:0 7px 0 var(--line)}
.qp{border-width:5px;border-radius:28px;box-shadow:0 6px 0 var(--line)}
.opt{border:4px solid #fff;border-radius:26px;box-shadow:0 5px 0 var(--line)}
.opt.good{box-shadow:0 5px 0 #1F9A63}.opt.bad{box-shadow:0 5px 0 #D94F4F}
.fbcard{border:3px solid #fff;border-radius:22px;box-shadow:0 4px 0 var(--line)}
.dot{width:16px;height:16px}
.empty{border:3px dashed var(--line);border-radius:26px}
#toast{background:#fff;color:var(--ink);border:3px solid var(--sun);border-radius:26px;box-shadow:0 6px 0 rgba(52,64,110,.15)}
.tsub{color:var(--muted)}
.ovbox{border-radius:32px;border:4px solid var(--sun)}
.seal{border-radius:50%;width:160px;height:160px}
.fr{background:#EEF6FF;border-radius:16px}
.pop{position:fixed;z-index:30;pointer-events:none;font-family:var(--emoji);font-size:30px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}

.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.wbox{box-sizing:content-box;border:5px solid var(--lc);border-radius:28px;box-shadow:0 7px 0 var(--line);margin:0 auto;touch-action:none;overflow:hidden;
  background:linear-gradient(var(--line),var(--line)) 50% 0/2px 100% no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 2px no-repeat,#fff}
.flash .fb .meta{font-size:5.4cqw;padding:0 6cqw;text-align:center}
.wnote{grid-column:1/-1;font-size:15px;color:var(--muted);text-align:center;margin:0}
.winfo{display:flex;flex-direction:column;align-items:center;gap:10px}
.winfo .e{font-family:var(--emoji);font-size:60px;line-height:1.1}
.winfo .t{font-size:32px}
.wstat{font-size:22px;color:var(--seal);min-height:1.4em;text-align:center}
@media (max-width:520px){.tab{flex-direction:column;gap:0;font-size:15px}}
.mark.ph{width:58px;height:58px;overflow:hidden;border:3px solid #fff}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.ovph{width:104px;height:104px;border-radius:50%;object-fit:cover;border:5px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.ovph.mini{object-fit:contain;background:#fff;border-radius:24px;width:128px;height:128px}
.mark.ph{background:#fff}
.plph{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
/* ---- 태블릿(갤럭시 탭 S9 FE·아이패드 프로) 가로 화면 ---- */
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.sm{min-height:40px}
.chip{min-height:40px}
@media (orientation:landscape) and (min-width:900px){
  .flash{width:min(100%,420px,max(240px,calc((100dvh - 270px)*.75)))}
}
@media (orientation:landscape) and (min-width:900px) and (max-height:700px){
  .stripe{height:6px;border-radius:0}
  .wrap{padding-top:6px;gap:8px;padding-bottom:12px}
  #stage{gap:8px}
  .mark,.mark.ph{width:40px;height:40px;font-size:24px}
  h1{font-size:22px}
  .foot{display:none}
  .opt{min-height:88px}
  .qp .h{font-size:92px}
  .qp .e{font-size:64px}
  .qp .t{font-size:30px}
}
@media (orientation:portrait) and (min-width:600px){
  .rot{display:block}
}
.rot{display:none;background:var(--sun);border-radius:16px;padding:8px 14px;text-align:center;font-size:16px}

.duel{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:2px 0 6px}
.fig{position:relative;display:flex;flex-direction:column;align-items:center}
.fig .top{font-family:var(--emoji);font-size:34px;line-height:1;height:40px}
.fig img{width:124px;height:124px;object-fit:contain;background:#fff;border-radius:24px;border:4px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.fig.win img{animation:hop .55s ease-in-out infinite alternate}
.fig.win .top{animation:hop .55s ease-in-out infinite alternate}
.fig.lose img{width:94px;height:94px;transform:rotate(-9deg);filter:saturate(.55);border-color:var(--line)}
.fig .say{font-size:15px;background:var(--bg);border-radius:14px;padding:4px 12px;margin-top:8px;white-space:nowrap}
.fig.win .say{background:var(--sun)}
.tear{position:absolute;font-family:var(--emoji);font-size:18px;top:62px;animation:tear 1s linear infinite;pointer-events:none}
.tear.l{left:calc(50% - 26px)}.tear.r{left:calc(50% + 8px);animation-delay:.5s}
@keyframes hop{to{transform:translateY(-12px) rotate(3deg)}}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(44px);opacity:0}}
.seal.sm{width:92px;height:92px;border-width:5px;border-radius:50%;margin:0}
.seal.sm span:first-child{font-size:26px}.seal.sm span:last-child{font-size:15px}.gift{display:flex;align-items:center;gap:12px;background:var(--sun);border-radius:20px;padding:10px 16px;margin:6px 0;text-align:left;font-size:19px;animation:hop .6s ease-in-out infinite alternate}
.gift span{font-family:var(--emoji);font-size:44px;line-height:1}
.gift b{font-weight:400;color:var(--seal);font-size:22px}
.gift small{font-size:14px;color:var(--ink);opacity:.75}
.mile{font-size:19px;color:var(--c6)}
.crown{margin-left:8px;padding-left:10px;border-left:2px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.crown span{font-family:var(--emoji)}
.crown b{color:#E0A100}
.ctrl{display:flex;flex-direction:column;gap:14px}
.chip.rev{--lc:var(--seal)}
.side{display:flex;flex-direction:column;gap:14px;align-items:center}
.friends{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}

function tone(f,d,type='triangle',vol=.4,when=0){

let koVoice=null,spoke=false,spErr='',uttKeep=null;

function speakText(text,tryNo=0){
  if(!('speechSynthesis' in window))return;
  try{
    const busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(busy)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    uttKeep=u; /* 안드로이드에서 읽기 전에 사라지지 않게 붙잡아 둠 */
    if(tryNo===0){u.lang='ko-KR';if(koVoice)u.voice=koVoice}
    else if(tryNo===1){u.lang='ko-KR'}
    /* tryNo 2: 언어·음성 지정 없이 기기 기본 음성 */
    u.rate=.9;u.volume=1;
    let started=false;
    u.onstart=()=>{started=true;spoke=true};
    u.onend=()=>{started=true};
    u.onerror=e=>{spErr=(e&&e.error)||'error';if(!started&&tryNo<2&&spErr!=='interrupted'&&spErr!=='canceled'){started=true;speakText(text,tryNo+1)}};
    const go=()=>{try{speechSynthesis.speak(u)}catch(e){spErr=String(e)}};
    if(busy)setTimeout(go,180);else go();
    setTimeout(()=>{if(!started&&uttKeep===u&&tryNo<2){try{speechSynthesis.cancel()}catch(e){}setTimeout(()=>speakText(text,tryNo+1),120)}},1600);
  }catch(e){spErr=String(e)}
}

        fb.textContent=pick1(['딩동댕! 잘 들었네요','정답! 최고야','맞았어요!']);
        if(!idLearned.has(c.id)){idLearned.add(c.id);save('hj-idiom',[...idLearned])}
        I.done++;if(I.done%5===0){award();showOv('성어 다섯 개 완료!',`배운 성어 ${idLearned.size}개`,()=>moveI(1))}
      }else{b.classList.add('bad');b.disabled=true;sfx.bad();fb.textContent='다시 한번 생각해 볼까요? 이야기를 다시 들어도 돼요'}
    }},o.t))),fb);
  $('#stage').replaceChildren(bar,card,side);
  if(auto&&S.voice)speakStory(c);
}
function moveI(d){
  if(d>0&&I.i===I.list.length-1){const last=I.list[I.i];I.list=I.mix(I.src);if(I.list.length>1&&I.list[0]===last)I.list.push(I.list.shift());I.i=0}
  else I.i=(I.i+d+I.list.length)%I.list.length;
  drawIdiom(true);
}

/* ---------- boot ---------- */
function start(data){
  if(data&&typeof data==='object')Object.assign(S,data);
  S.levels=(S.levels||[]).filter(k=>LV.some(l=>l.k===k));if(!S.levels.length)S.levels=['8'];
  $('#stampBtn').onclick=showFriends;
  $('#calBtn').onclick=syncCal;$('#chkBtn').onclick=soundCheck;
  {const fb=$('#fsBtn'),de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;
   const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement)||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
   const upd=()=>{fb.hidden=!req||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;fb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'전체 화면 끝내기':'전체 화면'};
   fb.onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=req.call(de,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>note('이 브라우저에서는 전체 화면을 켤 수 없어요. 홈 화면에 추가해서 열어 주세요.'))}}catch(e){note('이 브라우저에서는 전체 화면을 켤 수 없어요. 홈 화면에 추가해서 열어 주세요.')}};
   addEventListener('fullscreenchange',upd);addEventListener('webkitfullscreenchange',upd);upd();
   /* 터치 기기: 첫 터치 때 자동으로 전체 화면 (브라우저는 터치 없이 전체 화면을 허용하지 않음) */
   if(req&&matchMedia('(pointer:coarse)').matches){
     const auto=()=>{removeEventListener('pointerup',auto,true);removeEventListener('click',auto,true);
       if(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||document.fullscreenElement||document.webkitFullscreenElement)return;
       try{const r=req.call(de,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}};
     addEventListener('pointerup',auto,true);addEventListener('click',auto,true);
   }}
  addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushSync();flushState()}});addEventListener('pagehide',()=>{flushSync();flushState()});pullState();addEventListener('online',()=>scheduleSync(2000));
  if(day&&day.dirty)scheduleSync(2000);
  $('#photoBtn').onclick=photoMenu;$('#photoIn').onchange=pickPhoto;renderPhoto();
  $('#sfxBtn').onclick=()=>{S.sfx=!S.sfx;savePrefs();renderTools()};
  $('#voiceBtn').onclick=()=>{S.voice=!S.voice;savePrefs();renderTools();if(!S.voice){try{speechSynthesis.cancel()}catch(e){}}};
  let rsT=null,lastH=0;
  addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{setSH();if(S.mode==='match')layoutGrid();else if(S.mode==='write'&&W&&W.list.length&&Math.abs($('#stage').clientHeight-lastH)>30)drawWrite();lastH=$('#stage').clientHeight},150)});
  {const mb=$('#moreBtn'),bx=$('#moreBox');mb.onclick=e=>{e.stopPropagation();const o=!bx.classList.contains('open');bx.classList.toggle('open',o);mb.setAttribute('aria-expanded',String(o))};
   addEventListener('click',e=>{if(bx.classList.contains('open')&&!bx.contains(e.target)){bx.classList.remove('open');mb.setAttribute('aria-expanded','false')}});}
  addEventListener('keydown',e=>{
    if($('#ov').classList.contains('show')){if(e.key==='Escape')hideOv();return}
    if(S.mode==='flash'&&F&&F.list.length){if(e.key==='ArrowRight')moveF(1);else if(e.key==='ArrowLeft')moveF(-1);else if(e.key==='Escape'&&flashFs)setFlashFs(false)}
  });
  try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
  renderLevels();renderTabs();renderTools();startMode();
}
try{window.claude?.hot?.snapshot?.(()=>({mode:S.mode,levels:S.levels,pairs:S.pairs,players:S.players}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
